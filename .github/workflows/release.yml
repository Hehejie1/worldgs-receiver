name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  generate-icons:
    name: Generate Tauri Icons
    runs-on: ubuntu-latest
    steps:
      - id: prepare
        run: |
          mkdir -p /tmp/tauri-icons
          echo "/tmp/tauri-icons" >> $GITHUB_OUTPUT
      - name: Install Pillow
        run: pip install Pillow
      - name: Generate icons with Python
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          import os
          
          # Create a simple blue rounded rectangle icon
          for size, name in [(32, '32x32'), (128, '128x128'), (256, '128x128@2x')]:
              img = Image.new('RGBA', (size, size), (0, 92, 134, 0))
              draw = ImageDraw.Draw(img)
              # Draw a rounded rect
              margin = max(1, size // 16)
              draw.rounded_rectangle(
                  [margin, margin, size-margin, size-margin],
                  radius=size//4,
                  fill=(0, 92, 134, 255)
              )
              img.save(f'/tmp/tauri-icons/{name}.png')
              print(f'Created /tmp/tauri-icons/{name}.png')
          
          # Create favicon.png (for icon.ico)
          img = Image.new('RGBA', (256, 256), (0, 92, 134, 0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([8, 8, 248, 248], radius=64, fill=(0, 92, 134, 255))
          img.save('/tmp/tauri-icons/icon.png')
          print('Created /tmp/tauri-icons/icon.png')
          "

      - name: Generate .ico and .icns
        run: |
          # Install tauri-cli for icon generation
          npm install -g @tauri-apps/cli
          cd /tmp/tauri-icons
          npx tauri icon icon.png
          ls -la

      - name: Upload icons artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-icons
          path: /tmp/tauri-icons/

  generate-logo:
    name: Generate Logo
    runs-on: ubuntu-latest
    steps:
      - id: prepare
        run: |
          mkdir -p /tmp/worldgs-logo
          echo "/tmp/worldgs-logo" >> $GITHUB_OUTPUT
      - name: Install Pillow
        run: pip install Pillow
      - name: Generate logo.png
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          
          # Create a simple logo - 512x512 transparent with blue shape
          img = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          # Draw a circle
          draw.ellipse([64, 64, 448, 448], fill=(0, 92, 134, 255))
          # Draw a smaller circle in center
          draw.ellipse([180, 180, 332, 332], fill=(14, 118, 168, 255))
          img.save('/tmp/worldgs-logo/logo.png')
          print('Created logo.png')
          "
      - name: Upload logo artifact
        uses: actions/upload-artifact@v4
        with:
          name: worldgs-logo
          path: /tmp/worldgs-logo/

  build-macos-x86:
    name: macOS x86_64 Build
    needs: [generate-icons, generate-logo]
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Download icons
        uses: actions/download-artifact@v4
        with:
          name: tauri-icons
          path: desktop/src-tauri/icons

      - name: Download logo
        uses: actions/download-artifact@v4
        with:
          name: worldgs-logo
          path: worldgs_receiver/static

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sidecar
        run: bash desktop/scripts/build_sidecar_macos.sh

      - name: Copy sidecar to Tauri binaries
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp dist/receiver_sidecar desktop/src-tauri/binaries/receiver_sidecar-x86_64-apple-darwin
          chmod +x desktop/src-tauri/binaries/receiver_sidecar-x86_64-apple-darwin

      - name: Build desktop app
        run: |
          cd desktop
          npm ci
          npx tauri build --target x86_64-apple-darwin --bundles app

      - name: Create DMG
        run: |
          APP_BUNDLE_PATH="desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/WorldGS.app"
          DMG_OUTPUT_DIR="desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
          DMG_STAGE_DIR="$(mktemp -d)"
          mkdir -p "$DMG_OUTPUT_DIR"
          ditto "$APP_BUNDLE_PATH" "$DMG_STAGE_DIR/WorldGS.app"
          ln -s /Applications "$DMG_STAGE_DIR/Applications"
          hdiutil create -volname "WorldGS" -srcfolder "$DMG_STAGE_DIR" -ov -format UDZO "desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/WorldGS_macos_x86_64.dmg"
          rm -rf "$DMG_STAGE_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  build-macos-arm64:
    name: macOS aarch64 Build
    needs: [generate-icons, generate-logo]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download icons
        uses: actions/download-artifact@v4
        with:
          name: tauri-icons
          path: desktop/src-tauri/icons

      - name: Download logo
        uses: actions/download-artifact@v4
        with:
          name: worldgs-logo
          path: worldgs_receiver/static

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sidecar
        run: bash desktop/scripts/build_sidecar_macos.sh

      - name: Copy sidecar to Tauri binaries
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp dist/receiver_sidecar desktop/src-tauri/binaries/receiver_sidecar-aarch64-apple-darwin
          chmod +x desktop/src-tauri/binaries/receiver_sidecar-aarch64-apple-darwin

      - name: Build desktop app
        run: |
          cd desktop
          npm ci
          npx tauri build --target aarch64-apple-darwin --bundles app

      - name: Create DMG
        run: |
          APP_BUNDLE_PATH="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/WorldGS.app"
          DMG_OUTPUT_DIR="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          DMG_STAGE_DIR="$(mktemp -d)"
          mkdir -p "$DMG_OUTPUT_DIR"
          ditto "$APP_BUNDLE_PATH" "$DMG_STAGE_DIR/WorldGS.app"
          ln -s /Applications "$DMG_STAGE_DIR/Applications"
          hdiutil create -volname "WorldGS" -srcfolder "$DMG_STAGE_DIR" -ov -format UDZO "desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/WorldGS_macos_aarch64.dmg"
          rm -rf "$DMG_STAGE_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    name: Windows Build
    needs: [generate-icons, generate-logo]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download icons
        uses: actions/download-artifact@v4
        with:
          name: tauri-icons
          path: desktop/src-tauri/icons

      - name: Download logo
        uses: actions/download-artifact@v4
        with:
          name: worldgs-logo
          path: worldgs_receiver/static

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows
        run: |
          powershell -ExecutionPolicy Bypass -File .\desktop\scripts\build_desktop_windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Linux Build
    needs: [generate-icons, generate-logo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download icons
        uses: actions/download-artifact@v4
        with:
          name: tauri-icons
          path: desktop/src-tauri/icons

      - name: Download logo
        uses: actions/download-artifact@v4
        with:
          name: worldgs-logo
          path: worldgs_receiver/static

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux
        run: bash desktop/scripts/build_desktop_linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: desktop/src-tauri/target/release/bundle/deb/*.deb

  create-release:
    name: Create GitHub Release
    needs: [build-macos-x86, build-macos-arm64, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos-x86_64/*.dmg
            macos-aarch64/*.dmg
            windows/*.msi
            windows/*.exe
            linux/*.deb
