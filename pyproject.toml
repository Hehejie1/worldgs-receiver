[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldgs-receiver"
version = "0.0.1"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "qrcode>=7.4.2",
  "playwright>=1.45.0",
  "PyYAML>=6.0.1"
]

[project.optional-dependencies]
desktop = [
  "pyinstaller>=6.0.0"
]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["worldgs_receiver*"]

[tool.setuptools.package-data]
worldgs_receiver = ["static/*.png", "automation_platform_configs/*.yaml"]
