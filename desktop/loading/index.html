<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorldGS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .panel {
        width: min(560px, calc(100vw - 48px));
        padding: 28px 28px 24px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.35);
        text-align: center;
      }
      .title {
        margin: 0 0 12px;
        font-size: 26px;
        font-weight: 700;
      }
      .status {
        margin: 0;
        line-height: 1.6;
        color: #cbd5e1;
        white-space: pre-wrap;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 18px;
        margin-left: auto;
        margin-right: auto;
        border-radius: 999px;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #38bdf8;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="spinner" aria-hidden="true"></div>
      <h1 class="title">WorldGS</h1>
      <p id="status" class="status">正在启动本地 Receiver 服务，请稍候...</p>
    </div>
  </body>
</html>
